[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "mpkiservice"
description = "Python service to handle OpenSSL client certificates "
authors = [{name = "Akretion", email = "contact@akretion.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
readme = "README.md"
dependencies = [
  "fastapi",
  "uvicorn",
  "pydantic[email]",
  "pydantic[dotenv]",
  "phonenumbers",
  "requests",
  "passlib",
  "pycryptodome",
  "pydantic-settings",
  "pyyaml",
  "typer",
]
requires-python = ">=3.7"
dynamic = ["version"]

[project.optional-dependencies]
test = [
    "pytest",
    "coverage[toml]",
    "httpx",
]

[project.urls]
Homepage = "https://github.com/akretion/mpkiservice"
Source = "https://github.com/akretion/mpkiservice"

[project.scripts]
mpkiservice = "mpkiservice:main"
mpkiservice-cli = "mpkiservice.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build]
exclude = [
    "/.github",
]


[tool.ruff]
target-version = "py37"
fix = true

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]
ignore = [
]
exclude = [
    "docs/conf.py",
]

[tool.ruff.lint.isort]
known-first-party = []

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Depends"]


[tool.coverage.run]
branch = true
source_pkgs = ["mpkiservice"]

[tool.coverage.paths]
source = ["src", ".tox/*/site-packages"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
]



[tool.towncrier]
package = "mpkiservice"
package_dir = "src"
filename = "HISTORY.rst"
directory = "news"
issue_format = "`#{issue} <https://github.com/akretion/mpkiservice/issues/{issue}>`_"
title_format = "{version} ({project_date})"
